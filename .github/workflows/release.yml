name: Build & Publish APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ALPINE_BRANCH: v3.23
  REPO_NAME: main
  SIGNING_KEY_NAME: SolAstrius@alpine-apks.rsa

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the rust binaries OUTSIDE the alpine chroot, on the
      # ubuntu-latest runner directly. Two reasons:
      #
      #  1. rust toolchains from rustup are glibc-targeted by default;
      #     glibc binaries don't exec under a musl loader (which is
      #     what the alpine-sdk chroot the Build step runs in is). The
      #     musl-static rustup distribution that would solve this
      #     turns out to be flaky during install (rustc itself is
      #     static-pie musl and rustup's post-install verify call
      #     fails to read its version on the glibc host).
      #
      #  2. Cross-linking riscv64gc-unknown-linux-musl with plain
      #     rust-lld + link-self-contained=yes produces a static-pie
      #     binary that segfaults at execve on the live alpine guest
      #     (kernel/musl loader incompatibility). cargo-zigbuild
      #     produces working binaries on the same host. So we install
      #     zig + cargo-zigbuild here and let zig's linker handle the
      #     cross-musl shape.
      #
      # The chroot then only does packaging (abuild) — no rust /
      # zig / linker invocation happens inside the chroot at all,
      # which avoids the whole glibc/musl exec mess.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          targets: x86_64-unknown-linux-musl,riscv64gc-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Cache cargo-zigbuild
        id: cache-zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.20-${{ runner.os }}

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version '^0.20' --locked

      - name: Build rust binaries
        env:
          CARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$CARCH" in
            x86_64)  target=x86_64-unknown-linux-musl     ;;
            riscv64) target=riscv64gc-unknown-linux-musl  ;;
            *) echo "unsupported CARCH=$CARCH" >&2; exit 1 ;;
          esac
          cd sources/scev-rs
          cargo zigbuild --release --target "$target" --workspace --locked
          # Sanity print so the apk Build step can resolve the path
          # via $GITHUB_WORKSPACE bind-mount inside the chroot.
          ls -la "target/$target/release/scev" "target/$target/release/scevd"

      - uses: jirutka/setup-alpine@v1
        with:
          branch: ${{ env.ALPINE_BRANCH }}
          packages: alpine-sdk sudo

      - name: Build packages
        shell: alpine.sh {0}
        env:
          CARCH: ${{ matrix.arch }}
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          set -eu

          # abuild refuses to run as root — set up keys under the runner
          # user's HOME which setup-alpine drops us into.
          install -d -m 700 "$HOME/.abuild"
          printf '%s' "$ABUILD_PRIVKEY" > "$HOME/.abuild/$SIGNING_KEY_NAME"
          chmod 600 "$HOME/.abuild/$SIGNING_KEY_NAME"
          # abuild-sign expects the matching .pub alongside the private key.
          install -m 644 \
            "$GITHUB_WORKSPACE/keys/$SIGNING_KEY_NAME.pub" \
            "$HOME/.abuild/$SIGNING_KEY_NAME.pub"
          echo "PACKAGER_PRIVKEY=\"$HOME/.abuild/$SIGNING_KEY_NAME\"" > "$HOME/.abuild/abuild.conf"

          # Also install the public key into /etc/apk/keys so apk accepts
          # the signatures on any subsequent verification step.
          sudo install -D -m 644 \
            "$GITHUB_WORKSPACE/keys/$SIGNING_KEY_NAME.pub" \
            "/etc/apk/keys/$SIGNING_KEY_NAME.pub"

          # abuild's `-r` flag would auto-install build deps via
          # abuild-apk, but that requires runner to be in the `abuild`
          # group AND for the current shell to have already loaded
          # that group (supplementary groups are loaded at process
          # creation; getgroups(2) doesn't re-read /etc/group). The
          # workarounds (sg, newgrp piped in, fresh-login shells) are
          # all fragile in this environment.
          #
          # Cleaner: source each APKBUILD in a subshell to extract
          # makedepends/checkdepends and pre-install them with
          # `sudo apk add`. Then plain `abuild -F` works without ever
          # needing the abuild group. abuild's -r is just a
          # convenience around the same apk add; doing it explicitly
          # is more transparent anyway.
          for pkg in main/*/; do
            name=$(basename "$pkg")
            echo "::group::abuild $name ($CARCH)"
            (
              cd "$pkg"
              # Subshell isolates APKBUILD's variable spew so it can't
              # leak makedepends from one package into the next.
              # abuild's validate step also wants `depends` (runtime
              # deps) resolvable up-front, not just makedepends —
              # it builds the dep graph for the whole package, not
              # just the build env. Source all three.
              deps=$(
                set +u
                makedepends=""; checkdepends=""; depends=""
                . ./APKBUILD
                printf '%s %s %s' "$makedepends" "$checkdepends" "$depends"
              )
              # Strip the make/checkdepends-style "!options" tokens
              # that abuild treats specially, plus blank entries.
              # awk-based filter: never exits non-zero on empty input,
              # which matters because the parent shell has set -e and
              # `grep -v` returns 1 when its output is empty.
              filtered=$(echo "$deps" | tr ' ' '\n' | awk '/^[^!]./' | sort -u | tr '\n' ' ')
              if [ -n "$(echo "$filtered" | tr -d ' ')" ]; then
                echo "+ sudo apk add $filtered"
                # shellcheck disable=SC2086
                sudo apk add --no-cache $filtered
              fi
              CARCH="$CARCH" abuild -F
            )
            echo "::endgroup::"
          done

      - name: Collect APKs
        shell: alpine.sh {0}
        env:
          CARCH: ${{ matrix.arch }}
        run: |
          set -eu
          out="$GITHUB_WORKSPACE/out/alpine/$ALPINE_BRANCH/$REPO_NAME/$CARCH"
          mkdir -p "$out"
          # abuild 3.16 puts ALL packages in `$HOME/packages/<repo>/<CARCH>/`
          # — including noarch packages, despite the package's own
          # `A:noarch` field in the index entry. There's no separate
          # `$HOME/packages/<repo>/noarch/` directory we can scan.
          #
          # Critical detail for the publish step: apk-tools downloads
          # packages from `<repo>/<A:>/<filename>` where `<A:>` is the
          # package's own arch field (from the index), not the host
          # arch. A package marked A:noarch must therefore be
          # fetchable at `<repo>/noarch/<filename>` — placing it only
          # in the per-arch dirs gives a 404 on `apk add`.
          #
          # We need to identify noarch packages explicitly by parsing
          # their .PKGINFO (.apk is a gzipped tar with .PKGINFO at the
          # root). For each apk we inspect, if its `arch = noarch` we
          # duplicate it into a sibling noarch_out dir. The per-arch
          # APKINDEX (built later by `apk index *.apk`) still lists
          # them so `apk update` finds them and `apk add` resolves to
          # `<repo>/noarch/<file>`.
          noarch_out="$GITHUB_WORKSPACE/out/alpine/$ALPINE_BRANCH/$REPO_NAME/noarch"
          mkdir -p "$noarch_out"
          if [ -d "$HOME/packages/$REPO_NAME/$CARCH" ]; then
            for apk in "$HOME/packages/$REPO_NAME/$CARCH"/*.apk; do
              [ -f "$apk" ] || continue
              cp "$apk" "$out/"
              # .PKGINFO lives at the tar root and has lines like
              # `arch = noarch` (whitespace around `=`). The .apk is
              # gzipped tar; tar -O dumps members to stdout.
              pkg_arch=$(tar -xzOf "$apk" .PKGINFO 2>/dev/null \
                | awk -F'=' '/^arch *=/{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')
              if [ "$pkg_arch" = "noarch" ]; then
                cp "$apk" "$noarch_out/"
              fi
            done
          fi
          # Drop the noarch dir if nothing landed there — keeps the
          # artifact tidy and avoids upload-artifact warnings.
          rmdir "$noarch_out" 2>/dev/null || true
          ls -la "$out"
          echo "--- noarch ---"
          ls -la "$noarch_out" 2>/dev/null || echo "(no noarch packages)"

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.arch }}
          path: out/

  publish:
    name: publish Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: jirutka/setup-alpine@v1
        with:
          branch: ${{ env.ALPINE_BRANCH }}
          packages: alpine-sdk apk-tools sudo

      - name: Stage + sign APKINDEX
        shell: alpine.sh {0}
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.abuild"
          printf '%s' "$ABUILD_PRIVKEY" > "$HOME/.abuild/$SIGNING_KEY_NAME"
          chmod 600 "$HOME/.abuild/$SIGNING_KEY_NAME"
          # apk index reads input .apks and verifies signatures against
          # keys it trusts — drop ours in before calling it.
          sudo install -D -m 644 \
            "$GITHUB_WORKSPACE/keys/$SIGNING_KEY_NAME.pub" \
            "/etc/apk/keys/$SIGNING_KEY_NAME.pub"

          site="$GITHUB_WORKSPACE/site"
          mkdir -p "$site"
          for art in "$GITHUB_WORKSPACE"/artifacts/apks-*/alpine/"$ALPINE_BRANCH"/"$REPO_NAME"/*/; do
            [ -d "$art" ] || continue
            arch=$(basename "$art")
            dest="$site/alpine/$ALPINE_BRANCH/$REPO_NAME/$arch"
            mkdir -p "$dest"
            cp -f "$art"/*.apk "$dest/"
            ( cd "$dest"
              apk index -o APKINDEX.tar.gz.unsigned *.apk
              abuild-sign -k "$HOME/.abuild/$SIGNING_KEY_NAME" APKINDEX.tar.gz.unsigned
              mv APKINDEX.tar.gz.unsigned APKINDEX.tar.gz
            )
          done

          # Publish the public key at a stable URL consumers can curl.
          install -D -m 644 "$GITHUB_WORKSPACE/keys/$SIGNING_KEY_NAME.pub" "$site/keys/$SIGNING_KEY_NAME.pub"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
